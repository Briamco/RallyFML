services:
  - type: web
    name: rallyfml
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rallyfml-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_PEPPER
        generateValue: true
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: rallyfml
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: rallyfml-db
    databaseName: rallyfml
    user: rally
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: virginia
    postgresMajorVersion: "17"

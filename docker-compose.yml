services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rallyfml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d rallyfml"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://rally:rally@db:5432/rallyfml
      SESSION_SECRET: ${SESSION_SECRET:-local-only-session-secret-change-this-value}
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:-local-only-pepper-change-this-value}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-local-setup-secret-change-me}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
